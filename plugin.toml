[plugin]
id = "yuilock"
name = "Yui 手机/电脑锁"
description = "让 Yui 可以惩罚主人：锁手机（熄屏/应用锁）或锁电脑（打开任何程序立即弹回桌面，N.E.K.O. 不受影响）。lock_phone / lock_pc 等工具由 Yui 自主决定何时调用；电脑可用秘密按键组合解锁（不提示），重启即解锁。仅支持 Windows。注意：锁定期间会强制关闭新打开的程序，且是否触发由 LLM 自行判断；应用锁与电脑锁都有自动到期，不会永久锁死。"
short_description = "Yui 生气时可以锁主人的手机和电脑"
keywords = ["手机", "锁屏", "锁机", "应用锁", "锁电脑", "惩罚", "生气", "phone", "lock", "pc"]
version = "1.7.5"
license = "MIT"
entry = "plugins.yuilock:YuiLockPlugin"

[plugin.author]
name = "baixiangyuan"
url = "https://github.com/baixiangyuan"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Yui 手机/电脑锁"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

# 手机端 Yui Lock App 的连接配置
[yuilock]
# auto = UDP 广播自动发现手机；也可固定填手机 IP
host = "auto"
port = 48912
# 必须和手机 App 里显示的配对令牌一致（App 留空则不校验）
# 这一行会被 git 跟踪：提交前请改回空值，或改用 pair_qr.py 的 --save 在本地写入后不要提交
token = ""
# auto=先局域网后蓝牙；lan=仅局域网；bt=仅蓝牙
transport = "auto"
# 蓝牙通道用：手机在 Windows 蓝牙里的名字（留空=用第一个已配对 SPP 设备）
bt_device_name = ""
# 锁电脑时额外放行的程序完整路径列表（只有这里列出的路径会额外放行，同目录程序不会自动信任；
# N.E.K.O. 前端本体如被误关，把它的 exe 完整路径加进来；锁进程自身的解释器已自动放行）
pc_allow = []

# ---- 防滥用（由 LLM 自主调用时生效；面板按钮是人工确认，不受冷却/次数限制）----
# 同一目标的冷却时间（秒）：刚锁过手机/电脑，短时间内不能再锁同一个目标。0=不限制
lock_cooldown_sec = 180
# 每天最多锁几次（手机+电脑合计，按自然日）。0=不限制
lock_daily_limit = 5
# 手机应用锁自动解除时间（秒）。手机端到点自己解除，电脑掉线也有效。
# 手机端另有硬上限：0 按默认 600 秒、超过 3600 秒会被截到 3600 —— 不存在「永久锁」
phone_applock_ttl = 600
# 电脑锁自动解除时间（秒）。0=不自动解除（只靠秘密按键/重启）。锁机进程自己计时退出
pc_lock_ttl = 300
