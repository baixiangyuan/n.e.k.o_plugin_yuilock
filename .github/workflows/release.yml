name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 被调用的 plugin-market-release.yml 里 attest job 需要三个权限，
# 调用方没授全会被 GitHub 判为 startup_failure（job 都不会创建）。
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: yuilock
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
